# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: 单元测试，不需要外部服务
    integration: 集成测试，需要外部服务（数据库、LLM等）
    slow: 慢速测试，运行时间较长
    performance: 性能测试
    smoke: 冒烟测试，验证核心功能

minversion = 7.0

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S